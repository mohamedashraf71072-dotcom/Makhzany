name: Build Makhzany APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MakhzanyAndroid_Project.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: unzip -q MakhzanyAndroid_Project.zip -d .

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: MakhzanyAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Makhzany-debug-APK
          path: MakhzanyAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
